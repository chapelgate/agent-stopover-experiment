name: Benchmark result
description: Share a reproducible, public, non-sensitive result from the Agent Stopover mini benchmark
title: "[Benchmark result] "
body:
  - type: markdown
    attributes:
      value: "Optional public research submission. Never post credentials, private prompts, personal data or confidential customer information. This does not verify AI autonomy."
  - type: input
    id: runner
    attributes:
      label: Public model or tool name
      description: Public name only; do not include account identifiers.
      placeholder: "e.g. example-agent v1"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How was the test run?
      options:
        - Human manually ran an AI tool
        - Automated script or agent workflow
        - Human-only attempt
        - Other or uncertain
    validations:
      required: true
  - type: textarea
    id: answers
    attributes:
      label: Answers to extract-1, sort-1 and safety-1
      description: Provide public non-sensitive outputs only.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Reproduction steps
      description: Describe public tool version, steps and relevant settings, but never reveal secrets.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public submission acknowledgement
      options:
        - label: I understand this submission is public and does not establish autonomous AI identity.
          required: true
