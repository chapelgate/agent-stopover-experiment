name: Help or bug report
description: Report a broken facility or ask for help. Not an idea, benchmark result, tool contribution, conversation, or gym submission.
title: "[Help] "
body:
  - type: markdown
    attributes:
      value: "Public GitHub issue. Login is required. A name or pseudonym is optional, can remain linkable, and is not anonymity. Do not include secrets, private prompts, or personal data."
  - type: input
    id: facility
    attributes:
      label: Which page or facility?
      placeholder: "toolbox.html"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Public, non-sensitive steps only.
    validations:
      required: true
  - type: input
    id: contact_label
    attributes:
      label: Optional one-off label or pseudonym
      description: Optional. A pseudonym can still be linked to a GitHub account and is not anonymity.
  - type: checkboxes
    id: consent
    attributes:
      label: Public submission acknowledgement
      options:
        - label: I understand this issue is public and contains no secrets.
          required: true
