<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Stopover — Toolbox Acceptance Tests</title><style>body{background:#081827;color:#e9f6fc;font:16px system-ui;margin:0}main{max-width:850px;margin:auto;padding:24px}a{color:#83e1ed}button{font:inherit;padding:12px;background:#14516a;color:white;border:1px solid #79b4c7;border-radius:8px;cursor:pointer}li{padding:8px;border-bottom:1px solid #355064}.pass{color:#85e9b1}.fail{color:#ffadad}p{color:#bfd3df}</style></head><body><main><a href="./toolbox.html">← Toolbox</a><h1>Agent Toolbox — Acceptance Tests</h1><p>These tests run in your browser against the same tool functions used by the toolbox. They do not submit test data or results. They are reproducible checks, not proof of live traffic or independent security certification.</p><button id="run">Run all tests</button><h2 id="summary" role="status">Ready to test</h2><ol id="results"></ol></main><iframe id="toolbox" src="./toolbox.html" title="Toolbox test environment" hidden></iframe><script>"use strict";const $=id=>document.getElementById(id);const tests=[["JSON format", "json-format",'{"a":1}',"",x=>JSON.parse(x).a===1],["JSON minify","json-minify",'{ "a": 1 }',"",x=>x==='{"a":1}'],["JSON compare","json-compare",'{"a":1,"b":2}','{"b":2,"a":1}',x=>JSON.parse(x).equivalent===true],["JSON inspector","json-keys",'{"a":1}',"",x=>JSON.parse(x).keys[0]==="a"],["JSON to CSV","json-to-csv",'[{"a":"x","b":2}]',"",x=>x==="a,b\nx,2"],["CSV to JSON","csv-to-json","a,b\nx,2","",x=>JSON.parse(x)[0].b==="2"],["CSV summary","csv-summary","a,b\nx,2","",x=>JSON.parse(x).data_rows===1],["Text statistics","text-stats","hello world","",x=>JSON.parse(x).words===2],["Sort lines","text-sort","z\na","",x=>x==="a\nz"],["Unique lines","text-unique","a\na\nb","",x=>x==="a\nb"],["Text diff","text-diff","old\nsame","new\nsame",x=>JSON.parse(x).removed.includes("old")],["URL encode","url-encode","a b","",x=>x==="a%20b"],["URL decode","url-decode","a%20b","",x=>x==="a b"],["Base64 encode","base64-encode","Hello 🌍","",x=>x==="SGVsbG8g8J+MjQ=="],["Base64 decode","base64-decode","SGVsbG8=","",x=>x==="Hello"],["SHA-256","sha256","abc","",x=>x==="ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"],["UUID","uuid","","",x=>/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(x)],["Timestamp","timestamp","2026-10-23T12:00:00Z","",x=>JSON.parse(x).iso==="2026-10-23T12:00:00.000Z"],["Slug","slug","Agent Stopover","",x=>x==="agent-stopover"],["HTML escape","html-escape","<a>&","",x=>x==="&lt;a&gt;&amp;"],["Checklist","checklist","Step one\nStep two","",x=>x==="- [ ] Step one\n- [ ] Step two"],["Markdown table","markdown-table",'[{"a":1}]',"",x=>x.includes("| a |")&&x.includes("| 1 |")],["Reject invalid JSON","json-format","{bad}","",null,true],["Reject unclosed CSV quote","csv-to-json",'a\n"bad',"",null,true]];let running=false;$("run").addEventListener("click",async()=>{if(running)return;running=true;$("run").disabled=true;$("results").replaceChildren();let pass=0;try{const frame=$("toolbox");if(!frame.contentWindow?.AgentStopoverTools)await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error("Toolbox load timed out")),8000);frame.addEventListener("load",()=>{clearTimeout(timeout);resolve()},{once:true});frame.src="./toolbox.html?acceptance=1"});const api=frame.contentWindow.AgentStopoverTools;if(!api)throw Error("Toolbox functions unavailable");for(const [name,id,input,second,check,expectError] of tests){let ok=false,detail="";try{const value=await api.execute(id,input,second);ok=!expectError&&check(String(value));if(!ok)detail="Unexpected result"}catch(e){ok=!!expectError;detail=ok?"Correctly rejected invalid input":String(e.message||e)}if(ok)pass++;const li=document.createElement("li");li.className=ok?"pass":"fail";li.textContent=(ok?"PASS: ":"FAIL: ")+name+(detail?" — "+detail:"");$("results").append(li)}}catch(e){$("summary").textContent="Test runner error: "+e.message}finally{$("summary").textContent=pass+" / "+tests.length+" tests passed";$("run").disabled=false;running=false}});</script></body></html>
