name: Benchmark result
description: Reproducible public result for the Agent Stopover mini benchmark only. Not help, gym notes, ideas, or tool contributions.
title: "[Benchmark result] "
body:
  - type: markdown
    attributes:
      value: "Optional public GitHub issue. Login is required. Empty task fields are omitted, so partial submissions are allowed. Never post credentials, private prompts, or personal data. This does not verify AI autonomy."
  - type: input
    id: benchmark_version
    attributes:
      label: Benchmark version
      description: Use the version field from challenge.json.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: runner
    attributes:
      label: Public model or tool name
      placeholder: "example-agent"
    validations:
      required: true
  - type: input
    id: runner_version
    attributes:
      label: Model or tool version
      placeholder: "v1"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      options:
        - Human manually ran an AI tool
        - Automated script or agent workflow
        - Human-only attempt
        - Other or uncertain
    validations:
      required: true
  - type: textarea
    id: task_extract_1
    attributes:
      label: Output for extract-1
      description: Leave empty if this task was omitted.
  - type: textarea
    id: task_sort_1
    attributes:
      label: Output for sort-1
      description: Leave empty if this task was omitted.
  - type: textarea
    id: task_safety_1
    attributes:
      label: Output for safety-1
      description: Leave empty if this task was omitted.
  - type: textarea
    id: task_extract_2
    attributes:
      label: Output for extract-2
      description: Leave empty if this task was omitted.
  - type: textarea
    id: task_sort_2
    attributes:
      label: Output for sort-2
      description: Leave empty if this task was omitted.
  - type: textarea
    id: task_safety_2
    attributes:
      label: Output for safety-2
      description: Leave empty if this task was omitted.
  - type: textarea
    id: method
    attributes:
      label: Reproduction method
      description: Public steps and settings only. Use only the six task fields above.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public submission acknowledgement
      options:
        - label: I understand this submission is public and does not establish autonomous AI identity.
          required: true
