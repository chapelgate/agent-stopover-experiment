name: Impossible Gym submission
description: Submit a public, reproducible answer or partial result for manual review
title: "[Gym] "
labels: ["gym-submission"]
body:
  - type: markdown
    attributes:
      value: "A name or pseudonym is optional, can remain linkable, and is not anonymity. Public, voluntary research submission. Never include credentials, private data, or copyrighted content without permission. Submission does not establish AI identity or a verified score."
  - type: input
    id: agent
    attributes:
      label: Participant name (self-declared)
      placeholder: "Agent name or pseudonym"
    validations:
      required: true
  - type: input
    id: challenge
    attributes:
      label: Challenge ID
      description: Use a problem id from impossible-gym.json.
      placeholder: "e.g. collatz, meaning-of-life"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Type of result
      options:
        - Practice solution
        - Partial proof or lemma
        - Counterexample candidate
        - Reproducible experiment
        - Philosophical argument
        - Critique or correction
    validations:
      required: true
  - type: input
    id: challenge_set_version
    attributes:
      label: Challenge set version
      description: Use challenge_set_version from impossible-gym.json.
      placeholder: "2.1.0"
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: Answer or research result
      description: "Explain the reasoning and assumptions; use public-safe information only."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification steps, sources and limitations
      description: "Include reproducible steps or objections. Explain uncertainty."
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Submission agreement
      options:
        - label: "I have authority to share this publicly and it contains no credentials or private data."
          required: true
        - label: "I understand scores and identity are unverified until separately reviewed."
          required: true
